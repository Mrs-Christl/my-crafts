<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Crafts</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="My Crafts">
<meta name="theme-color" content="#f6f6f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:wght@600&family=DM+Serif+Display&family=Fredoka:wght@500&family=Nunito:wght@400;700&family=Patrick+Hand&family=Playfair+Display:wght@600&family=Quicksand:wght@600&family=Shrikhand&display=swap" rel="stylesheet">
<style>
/* VOICE: whimsical, cosy, gentle encouragement, never nagging
IDEA: a hand-stitched scrapbook: dashed stitching, a yarn strand, tabs like fabric labels
PICTURE: picture grids of saved ideas, a wall of supplies, finished makes
COLOUR and TYPE: set by the chosen theme (default: olive, dusty rose, chestnut, wine); fonts per theme
LAYOUT: craft name top right, big tabs, chips row, masonry grid; details open in sheets */
:root{color-scheme:light;--acc:#943d47;--bg:#f7f0ea;--card:#fffaf6;--ink:#3a2520;--soft:#7d6058;--olive:#837f26;--rose:#b88896;--brown:#78412c;--wine:#943d47;--roseTint:#f3e3e5;--oliveTint:#edebd5;--line:#e4cfd0;--on1:#fff6f1;--on2:#fffbe9;--fh:Fredoka,sans-serif;--fb:Nunito,system-ui,sans-serif;--fd:Caveat,cursive;--bw:1.5px;--bs:dashed}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) var(--pat);min-height:100vh;color:var(--ink);font:16px/1.55 var(--fb);overflow-x:clip;transition:background .3s}
button,input,select,textarea{font-family:var(--fb)}
.top{position:sticky;top:0;z-index:5;background:var(--bg) var(--pat);box-shadow:0 1px 0 var(--line);padding-bottom:4px;padding:12px max(4vw,14px) 0}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1240px;margin:auto}
.hleft{display:flex;align-items:center;gap:10px;flex:1 1 auto;min-width:0}
.hright{display:flex;align-items:center;gap:6px;flex:none}
.iconbtn{border:0;background:none;padding:0;cursor:pointer;width:50px;height:50px;display:grid;place-items:center}
.iconbtn svg{width:50px;height:50px}
.greet{margin:0;font:700 16px var(--fb);color:var(--brown);line-height:1.2}
.q{font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{flex:none;font:700 13px var(--fb);background:var(--oliveTint);color:var(--ink);padding:4px 10px;border-radius:999px;white-space:nowrap}
.sbtn2{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--brown);display:grid;place-items:center;cursor:pointer}
.sbtn2.on{background:var(--olive);color:var(--on2)}
.spanel{max-width:1240px;margin:8px auto 0;background:var(--card);border-radius:18px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spanel input[type=range]{width:140px;accent-color:var(--olive);min-height:0;padding:0;border:0;background:none}
.decor{flex:none;width:48px;height:48px}
.tabwrap{position:relative;max-width:1240px;margin:8px auto 0}
.tabwrap .tabs{margin-top:0}
.lights{position:absolute;left:0;right:0;top:-6px;height:30px;pointer-events:none;z-index:2}
.craftbtn{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;color:var(--brown);padding:4px 0;min-height:44px}
.craftbtn b{font:500 30px/1.05 var(--fh)}
.hand{font-family:var(--fd);font-size:21px;color:var(--rose);margin:0;line-height:1.25}
.hand.big{font-size:23px;color:var(--brown)}
.tabs{display:flex;gap:6px;max-width:1240px;margin:8px auto 0;border-bottom:3px solid var(--wine)}
.tab{flex:1 1 0;border:0;background:var(--card);font:700 clamp(14px,2.3vw,19px)/1.15 var(--fb);color:var(--soft);padding:10px 4px 9px;border-radius:18px 18px 0 0;min-height:70px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center}
.tab svg{width:26px;height:26px}
.tab[aria-selected=true]{background:var(--wine);color:var(--on1)}
.strand{display:block;width:100%;height:24px;max-width:1240px;margin:0 auto;color:var(--rose)}
main{padding:16px max(3vw,14px) 90px;max-width:1240px;margin:12px auto 40px;background:color-mix(in srgb,var(--bg) 86%,transparent);border-radius:24px;width:calc(100% - 2*max(3vw,10px))}
.gbox{background:var(--card);padding:4px 12px;border-radius:14px}
.craftbtn{background:var(--card)!important;padding:4px 16px!important;border-radius:999px}
.iconbtn{background:var(--card);border-radius:50%}
.decor{background:var(--card);border-radius:50%;padding:4px}
.syncpill{flex:none;border:0;cursor:pointer;font:700 13px var(--fb);background:var(--oliveTint);color:var(--ink);padding:6px 12px;border-radius:999px;white-space:nowrap;min-height:34px}
.syncpill.warn{background:var(--wine);color:var(--on1)}
.tpat{display:block;height:64px;border-radius:12px;margin:-4px -4px 4px}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px;scrollbar-width:none;flex:1 1 280px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:var(--bw) var(--bs) var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font:700 14px var(--fb);min-height:42px;cursor:pointer}
.chip.cap1{text-transform:capitalize}
.chip[aria-pressed=true]{background:var(--olive);border:1.5px solid var(--olive);color:var(--on2)}
.chip.sm{min-height:30px;padding:3px 10px;font-size:13px;cursor:default}
.chip.big{font-size:17px;padding:10px 20px;min-height:50px}
.stabs{margin-bottom:12px}
.n{font:700 12px var(--fb);opacity:.7}
.btn{border:1.5px solid var(--brown);background:transparent;color:var(--brown);border-radius:14px;padding:9px 16px;font:700 15px var(--fb);min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--wine);border-color:var(--wine);color:var(--on1)}
.btn.olive{background:var(--olive);border-color:var(--olive);color:var(--on2)}
.btn.ghost{border-color:transparent;color:var(--soft)}
.btn.light{border-color:var(--on2);color:var(--on2)}
.btn.small{min-height:38px;padding:5px 12px;font-size:14px}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.sub{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;margin:0 0 14px}
.tog{display:flex;align-items:center;gap:10px;font:700 15px var(--fb);margin:14px 0;cursor:pointer}
.sub .tog{margin:0}
.tog input,.step input,.hr input[type=checkbox]{width:22px;height:22px;accent-color:var(--olive);flex:none;margin:0}
.masonry{columns:4 155px;column-gap:14px}
@media(max-width:600px){.masonry{column-gap:10px}.tile{margin-bottom:10px}}
.masonry.sm{columns:3 130px;column-gap:10px}
.tile{display:block;width:100%;break-inside:avoid;margin:0 0 14px;padding:0;border:0;background:var(--card);border-radius:18px;overflow:hidden;text-align:left;color:inherit;cursor:pointer;position:relative}
.tile.on{outline:3px solid var(--olive)}
.m{position:relative;display:block;width:100%}
.m.plain{border:0;padding:0;background:none;cursor:pointer}
.tile img,.tile svg.art,.m img,.m svg.art{display:block;width:100%;height:auto}
.badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:4px;background:rgba(255,250,245,.92);color:#5a3a30;font:700 12px var(--fb);padding:4px 9px;border-radius:999px}
.badge svg{width:14px;height:14px}
.play{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(255,250,245,.93);display:grid;place-items:center}
.play.s{inset:auto;top:38px;left:38px;width:34px;height:34px}
.cap{display:block;padding:10px 12px 12px}.cap b{font:700 15px/1.3 var(--fb);display:block}
.dots{display:flex;gap:4px;margin-top:6px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 1.5px var(--card),0 0 0 2.5px var(--line);flex:none}
.tag{display:inline-block;font:700 12px var(--fb);color:var(--acc);background:var(--roseTint);padding:3px 9px;border-radius:999px}
.tag.olive{color:var(--ink);background:var(--oliveTint)}
.small{font-size:13px;color:var(--soft)}
h2.h{font:500 22px var(--fh);color:var(--brown);margin:8px 0}
.sheet h2{font:500 27px/1.15 var(--fh);color:var(--brown);margin:4px 0 8px;text-wrap:balance}
h3{font:500 18px var(--fh);color:var(--acc);margin:22px 0 8px;display:flex;align-items:center;gap:6px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.pcard{display:flex;gap:14px;text-align:left;background:var(--card);border:var(--bw) var(--bs) var(--line);border-radius:20px;padding:12px;color:inherit;font:inherit;cursor:pointer}
.pm{flex:none;width:100px;height:100px;border-radius:14px;overflow:hidden}
.pm>img,.pm>svg{width:100%;height:100%;object-fit:cover;display:block}
.pb{flex:1;display:flex;flex-direction:column;gap:6px}.pb b{font:500 18px/1.2 var(--fh);color:var(--brown)}
.prog{height:12px;background:var(--oliveTint);border-radius:999px;overflow:hidden}
.prog.big{height:18px}
.prog i{display:block;height:100%;background:var(--olive) repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.28) 9px 11px);border-radius:999px}
.next{background:var(--roseTint);border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px}
.next small{font:700 12px var(--fb);color:var(--brown);display:block}
.next.unsure{background:var(--oliveTint);font-weight:400}
.next.unsure small{color:var(--olive)}
.nextbox{background:var(--roseTint);border-radius:18px;padding:14px 16px;margin:14px 0}
.nextbox small{font:700 13px var(--fb);color:var(--brown);display:block;margin-bottom:4px}
.nextbox .nt{font:500 21px/1.25 var(--fh);color:var(--ink);margin:0 0 10px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.yarn{background:var(--card);border:var(--bw) var(--bs) var(--line);border-radius:20px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font:inherit;color:inherit;cursor:pointer;position:relative}
.yarn.on{border:2px solid var(--olive);background:var(--oliveTint)}
.yarn b{font:700 15px/1.25 var(--fb)}
.ym{width:100%;aspect-ratio:1;display:grid;place-items:center}
.ym img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.ym svg{width:100%;height:100%}
.tick{position:absolute;top:8px;right:8px;background:var(--olive);color:var(--on2);border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{border:1.5px solid transparent;background:var(--card);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 13px var(--fb);color:var(--ink);cursor:pointer;min-width:86px;max-width:130px;text-align:center}
.sw.on{border-color:var(--olive);background:var(--oliveTint)}
.sw.add{border:var(--bw) var(--bs) var(--line);justify-content:center;color:var(--soft);min-height:92px}
.sw img{width:56px;height:56px;object-fit:cover;border-radius:50%}
.year{background:var(--olive);color:var(--on2);border-radius:22px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.year .hand{color:var(--on2);opacity:.85;font-size:23px}
.stats{display:flex;gap:20px;font:700 15px var(--fb)}.stats b{font:500 32px var(--fh);margin-right:5px}
.overlay{position:fixed;inset:0;background:rgba(30,18,14,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);width:min(780px,100%);max-height:93vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px max(4vw,18px) 34px}
@media(min-width:800px){.overlay{align-items:center}.sheet{border-radius:26px}}
.x{position:sticky;top:0;float:right;z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;margin:0 0 4px 8px}
.x.bk{float:left;margin:0 8px 4px 0}
.hero{border-radius:20px;overflow:hidden;margin:4px 0 14px;background:var(--card);clear:both}
.hero img,.hero video,.hero>svg,.hero .m svg{width:100%;max-height:55vh;object-fit:contain;display:block}
.hero.sm img,.hero.sm video{max-height:240px}
.ph{background:var(--card);border:var(--bw) var(--bs) var(--line);border-radius:16px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;color:var(--soft);font-size:14px;flex:1 1 170px;text-align:center}
.ph img{width:100%;max-height:180px;object-fit:cover;border-radius:10px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.row.wrap{flex-wrap:wrap}
.th{flex:none;width:110px;border:0;padding:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;position:relative}
.th>img,.th>svg{width:110px;height:110px;object-fit:cover;border-radius:14px;display:block}
.th span{display:block;font-size:13px;margin-top:4px;line-height:1.3;font-weight:700}
.th.add{height:110px;border:var(--bw) var(--bs) var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--soft)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.note{background:var(--oliveTint);border-radius:14px;padding:12px 14px;margin:0 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.acts.end{justify-content:flex-end;margin-top:26px;border-top:var(--bw) var(--bs) var(--line);padding-top:14px}
label.f{display:block;font:700 14px var(--fb);margin:16px 0 6px}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:44px}
input[type=color]{padding:4px;height:48px;max-width:120px}
select.sel{width:auto;min-width:140px}
.err{color:var(--acc);font-weight:700;font-size:14px;margin:6px 0 0;min-height:1em}
.step{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 12px;border-radius:14px;background:var(--card);margin:6px 0}
.step label{flex:1;margin:0;font:700 15px var(--fb);cursor:pointer;padding:6px 0}
.step.done label{text-decoration:line-through;color:var(--soft)}
.step.first{box-shadow:inset 0 0 0 2px var(--wine)}
.mini{border:0;background:transparent;color:var(--soft);cursor:pointer;padding:4px 8px;border-radius:8px;min-width:38px;min-height:38px;display:inline-grid;place-items:center;font:700 13px var(--fb)}
.addrow{display:flex;gap:8px;margin-top:8px}
.setgrid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.snav{display:flex;flex-direction:column;gap:8px;background:var(--card);border-radius:20px;padding:8px}
.sbtn{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--soft);font:700 17px var(--fb);padding:12px 14px;border-radius:14px;cursor:pointer;text-align:left;min-height:52px}
.sbtn svg{width:24px;height:24px;flex:none}
.sbtn[aria-pressed=true]{background:var(--wine);color:var(--on1)}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:14px}
.crow{position:relative;display:flex;flex-direction:column;align-items:center;background:var(--card);border:var(--bw) var(--bs) var(--line);border-radius:22px;padding:10px 8px 6px}
.crow.on{border:2.5px solid var(--wine);background:var(--roseTint)}
.crow.dragging{opacity:.8;transform:scale(1.04);box-shadow:0 10px 24px rgba(0,0,0,.18);z-index:2}
.handle{position:absolute;top:6px;left:6px;touch-action:none;cursor:grab;color:var(--soft);display:grid;place-items:center;width:44px;height:44px}
.cpick{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:inherit;text-align:center;cursor:pointer;padding:8px 4px 2px;width:100%}
.cpick b{display:block;font:500 20px/1.2 var(--fh);color:var(--brown)}
.arrows{display:flex;justify-content:center;width:100%}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:0;border-bottom:var(--bw) var(--bs) var(--line);padding:14px 16px;color:inherit;font:inherit;cursor:pointer}
.lrow:first-child{border-radius:16px 16px 0 0}.lrow:last-child{border-radius:0 0 16px 16px;border-bottom:0}.lrow:only-child{border-radius:16px}
.lrow b{font:700 16px var(--fb);display:block}
.lrow .r{text-align:right;flex:none;max-width:45%}
@media(max-width:600px){.setgrid{grid-template-columns:96px minmax(0,1fr);gap:12px}.snav{padding:6px}.sbtn{flex-direction:column;font-size:13px;padding:10px 4px;text-align:center;gap:4px}.clist{grid-template-columns:repeat(auto-fill,minmax(min(100%,120px),1fr));gap:10px}.cpick b{font-size:16px}}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.theme{border:2px solid;border-radius:20px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;font:inherit}
.theme b{font-size:19px;font-weight:500}
.tsw{display:flex;gap:6px}.tsw i{width:26px;height:26px;border-radius:50%;display:block}
.ttag{align-self:flex-start;font:700 12px var(--fb);padding:3px 9px;border-radius:999px}
.tmini{display:flex;gap:6px;border:1.5px solid;border-radius:12px;padding:8px}.tmini i{height:10px;border-radius:5px;display:block;flex:1}
.hr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;margin:8px 0}
.hr label{display:flex;align-items:center;gap:8px;font:700 14px var(--fb);cursor:pointer}
.hr .small{grid-column:2}
.hr.off input:not([type=checkbox]){opacity:.5}
.empty{text-align:center;padding:30px 16px;display:flex;flex-direction:column;align-items:center;background:var(--card);border:var(--bw) var(--bs) var(--line);border-radius:22px}
.empty h3{justify-content:center}
.sug{display:grid;gap:10px}
.sg{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px;align-items:center}
.sgm{flex:none;width:86px;height:86px;border:0;padding:0;border-radius:12px;overflow:hidden;cursor:pointer}
.sgm>img,.sgm>svg{width:100%;height:100%;object-fit:cover;display:block}
.why{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 8px}
.yhero{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:18px;align-items:center;clear:both}
.ybig img{width:100%;border-radius:16px;display:block}
.kitems{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.kitems li{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:4px 6px 4px 14px;font-weight:700}
.kitems li span{flex:1}
.info{background:var(--roseTint);border-radius:16px;padding:4px 16px 14px}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.stats3 div{background:var(--roseTint);border-radius:16px;padding:12px 8px;text-align:center}
.stats3 b{display:block;font:500 28px var(--fh);color:var(--acc)}.stats3 span{font-size:13px}
.collage{columns:3 120px;column-gap:10px;margin:14px 0}
.ci{break-inside:avoid;margin-bottom:10px;border-radius:12px;overflow:hidden;border:5px solid var(--card)}
.ci:nth-child(odd){transform:rotate(-1.5deg)}.ci:nth-child(even){transform:rotate(1.2deg)}
.ci img,.ci svg{display:block;width:100%;height:auto}
.pdfv canvas{display:block;margin:0 0 10px;border-radius:8px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--brown);color:var(--bg);padding:12px 18px;border-radius:14px;font:700 15px var(--fb);z-index:30;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.box{background:var(--card);border-radius:18px;padding:4px 16px 16px;margin:10px 0}
.quick{display:flex;gap:8px;flex:1 1 320px}
.find{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;background:var(--card);border-radius:16px;padding:10px 12px}

function vIdeas(){const d=D(),uns=d.ideas.filter(i=>!i.cat),cats=['All',...(uns.length?['Unsorted']:[]),...d.cats,...(S.fx.palettes?['Palettes']:[])];if(!cats.includes(ui.cat))ui.cat='All';

 const cnt=c=>c==='All'?d.ideas.length:c==='Unsorted'?uns.length:c==='Palettes'?d.palettes.length:d.ideas.filter(i=>i.cat===c).length;

function vWheel(list){const items=list.filter(y=>y.kind!=='kit').map(y=>({y,h:hsl(y.hex)})).sort((a,b)=>a.h[0]-b.h[0]);let lastA=-99,alt=0;

function vData(){const signed=!!LS.get('user');return `<h2 class="h" style="margin-top:0">Your data is safe</h2>

let sheetFn=null,stack=[];
function capture(){$('#sheet').querySelectorAll('input[id]:not([type=checkbox]):not([type=file]),select[id],textarea[id]').forEach(e=>ui.vals[e.id]=e.value)}
function drawSheet(top,skip){const sh=$('#sheet');if(!top&&!skip)capture();const s=sh.scrollTop;sh.innerHTML=`<button class="x" data-act="close" aria-label="Close">${IC.x}</button>${stack.length?`<button class="x bk" data-act="back" aria-label="Back">${IC.back}</button>`:''}`+sheetFn();sh.scrollTop=top?0:s;hydrate(sh)}
function openSheet(fn){sheetFn=fn;$('#ov').hidden=false;drawSheet(true);document.body.style.overflow='hidden'}
function go(fn){if(sheetFn)stack.push(sheetFn);openSheet(fn)}
function back(){const f=stack.pop();if(f){sheetFn=f;drawSheet(true)}else closeSheet()}
function closeSheet(){$('#ov').hidden=true;sheetFn=null;stack=[];document.body.style.overflow='';render()}

async function makePost(){const {yr,items,gifts}=yearData(),W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue('--'+n).trim(),fh=v('fh'),fb=v('fb'),fd=v('fd');
 try{await document.fonts.ready}catch(_){}
 x.fillStyle=v('bg');x.fillRect(0,0,W,H);x.strokeStyle=v('rose');x.setLineDash([14,10]);x.lineWidth=4;x.strokeRect(36,36,W-72,H-72);x.setLineDash([]);
 x.save();x.translate(80,100);x.rotate(-.04);x.fillStyle=v('rose');x.globalAlpha=.4;x.fillRect(0,0,520,70);x.restore();x.globalAlpha=1;
 x.fillStyle=v('brown');x.font=`500 92px ${fh}`;x.fillText(`My ${yr}`,90,170);x.font=`500 58px ${fh}`;x.fillText(`in ${craftName().toLowerCase()}`,90,248);
 x.fillStyle=v('wine');x.font=`700 40px ${fb}`;x.fillText(`${items.length} finished · ${gifts.length} gifted`,90,318);
 const pick=items.slice(-6),imgs=await Promise.all(pick.map(g=>loadImg(g.img||svgUrl(art(g.art),400,400*((g.art&&g.art.h)||100)/100))));
 imgs.forEach((im,k)=>{const col=k%3,row=Math.floor(k/3),cw=290,ch=300,px=60+col*330+cw/2,py=390+row*420+ch/2;x.save();x.translate(px,py);x.rotate((k%2?1:-1)*.035);x.shadowColor='rgba(0,0,0,.18)';x.shadowBlur=20;x.fillStyle='#fffefb';x.fillRect(-cw/2-12,-ch/2-12,cw+24,ch+80);x.shadowBlur=0;
  if(im){const r=cw/ch;let sw=im.width,sh=im.height,sx=0,sy=0;if(sw/sh>r){sw=sh*r;sx=(im.width-sw)/2}else{sh=sw/r;sy=(im.height-sh)/2}x.drawImage(im,sx,sy,sw,sh,-cw/2,-ch/2,cw,ch)}
  x.fillStyle='#3a2520';x.font=`600 34px ${fd}`;let t=pick[k].title;while(x.measureText(t).width>cw&&t.length>3)t=t.slice(0,-2);if(t!==pick[k].title)t=t.trim()+'…';x.fillText(t,-cw/2,ch/2+46);x.restore()});
 if(!pick.length){x.fillStyle=v('soft');x.font=`600 44px ${fd}`;x.fillText('Finished makes will appear here.',90,600)}
 x.fillStyle=v('soft');x.font=`600 40px ${fd}`;x.fillText('Made by hand, with love',90,H-80);
 return c}

/* Getting the picture from a pasted link. A website can't read other websites itself, so it asks free helpers:
   TikTok's own preview service, YouTube's cover pictures, and Microlink (a free link-preview service) for everything else.
   The picture is then copied into the app (through the free wsrv.nl image service) so it never disappears. */
async function fetchPreview(u){
 const yt=u.match(/(?:youtu\.be\/|[?&]v=|shorts\/)([\w-]{11})/);if(yt)return {title:'',image:`https://img.youtube.com/vi/${yt[1]}/hqdefault.jpg`};
 if(/tiktok\.com/i.test(u)){try{const j=await (await fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(u))).json();if(j&&j.thumbnail_url)return {title:j.title||'',image:j.thumbnail_url}}catch(e){}}
 if(S.lpKey){try{const r=await fetch('https://api.linkpreview.net/?q='+encodeURIComponent(u),{headers:{'X-Linkpreview-Api-Key':S.lpKey}});const j=await r.json();if(j&&j.image)return {title:j.title||'',image:j.image}}catch(e){}}
 try{const r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(u));if(r.status===429)return {limit:true};const j=await r.json();if(j&&j.status==='success'&&j.data){const d=j.data;return {title:d.title||'',image:(d.image&&d.image.url)||''}}}catch(e){}
 return null}
async function grabImage(src){for(const url of ['https://wsrv.nl/?url='+encodeURIComponent(src)+'&w=1800&output=jpg',src]){try{const r=await fetch(url);if(!r.ok)continue;const b=await r.blob();if(!/^image\//.test(b.type))continue;return await readImg(b)}catch(e){}}return null}

 case 'addcraft':{const inp=$('#newcraft'),t=inp.value.trim();if(!t){inp.focus();return}if(allCrafts().some(c=>c.name.toLowerCase()===t.toLowerCase())){$('#craftErr').textContent='You already have that one';return}const nid='c'+uid();S.custom=[...(S.custom||[]),{id:nid,name:t,hex:EXTRA[(S.custom||[]).length%EXTRA.length]}];S.crafts[nid]={cats:['General'],ideas:[],projects:[],yarns:[],gallery:[]};save();render();toast(t+' added. Tap it to open.');break}
 case 'supstyle':S.supStyle[S.craft]=v;save();render();break;
 case 'rm-samples':Object.values(S.crafts).forEach(c=>{['ideas','projects','yarns','gallery','palettes'].forEach(k=>c[k]=(c[k]||[]).filter(x=>!x.sample));cleanLinks(c)});S.occasions=(S.occasions||[]).filter(o=>!o.sample);save();render();toast('Sample items removed. Your own things are all still here.');break;
 case 'clear-craft':if(!sure(el))return;S.crafts[S.craft]={...blank(S.craft),cats:D().cats};save();render();toast(craftName()+' is empty');break;
 case 'mode':S.mode=v;save();applyTheme();render();break;
 case 'theme':S.theme=v;save();applyTheme();render();break;
 case 'hfont':S.hfont=el.value;save();applyTheme();break;
 case 'size':S.size=v;save();applyTheme();render();break;
 case 'hcraft':ui.hcraft=el.value;render();break;
 case 'hon':{const h=heads(el.dataset.c)[el.dataset.k];h.on=el.checked;save();render();break}
 case 'hname':{const t=el.value.trim();const h=heads(el.dataset.c)[el.dataset.k];if(t){h.n=t;save();render()}else el.value=h.n;break}
 case 'hreset':S.heads[el.dataset.c]=defHeads(el.dataset.c);save();render();break;
 case 'quick-save':{const raw=$('#quickLink').value.trim(),m=raw.match(/https?:\/\/\S+/i);if(!m){toast('Paste a link first');$('#quickLink').focus();return}const u=m[0].replace(/[),.]+$/,''),src=srcOf(u);let host='';try{host=new URL(u).hostname.replace(/^www\./,'')}catch(_){}const title=src==='Website'?host:src==='PDF pattern'?'PDF pattern':src+(['TikTok','Video'].includes(src)?' video':' post');const C={TikTok:['#f1e1e3','#943d47'],Instagram:['#f3e3ea','#b88896'],Pinterest:['#f6e2e2','#b84a4f'],Video:['#e3e7ee','#5b6f8c'],Etsy:['#f4e6df','#c4703f'],Website:['#e8ead9','#837f26'],'PDF pattern':['#f3ead0','#c9a23f']}[src];const nid=uid();d.ideas.unshift({id:nid,title,cat:'',source:src,link:u,img:null,art:{k:'bookmark',c1:C[0],c2:C[1],h:110},fams:[],type:'',yarns:[],noSup:true,notes:'',when:'soon',tut:[],combos:[]});$('#quickLink').value='';mark();save();ui.cat='Unsorted';render();autoPicture(d,nid,u,true);break}
 case 'assign':{const i=find(d.ideas,id);i.cat=v;save();render();toast('Moved to '+v);break}
 case 'icat':{find(d.ideas,id).cat=el.value;save();toast(el.value?'Moved to '+el.value:'Moved to Unsorted');break}
 case 'iwhen':find(d.ideas,id).when=v;save();drawSheet();break;
 case 'when':ui.when=v;render();break;
 case 'tut-add':{capture();const t=val('tutT').trim(),n=val('tutN').trim();if(!n&&!t)return;const i=find(d.ideas,id);i.tut=i.tut||[];i.tut.push({t,n});i.tut.sort((a,b)=>{const s=x=>x.t.split(':').reduce((m,p)=>m*60+(+p||0),0);return s(a)-s(b)});ui.vals.tutT='';ui.vals.tutN='';save();drawSheet(false,true);break}
 case 'tut-del':find(d.ideas,id).tut.splice(+el.dataset.k,1);save();drawSheet();break;
 case 'mkpal':{const i=find(d.ideas,id);toast('Picking out the colours...');extract(i.img||svgUrl(art(i.art),200,200)).then(cols=>{if(!cols.length){toast("Couldn't read the colours from that picture");return}const c={id:uid(),name:i.title+' colours',cols:cols.map(h=>({hex:h}))};d.combos.unshift(c);i.combos=[...(i.combos||[]),c.id];save();ui.vals={};go(sCombo(c.id));toast('Colour combo made. Rename it or tweak the colours.')});break}
 case 'savepal-month':{const [n,cols]=PALS[new Date().getMonth()];d.palettes.unshift({id:uid(),name:n,cols:[...cols]});S.dismiss['m'+dayKey().slice(0,7)]=1;save();render();toast('Palette saved');break}
 case 'dismiss':S.dismiss[v]=1;save();render();break;
 case 'pal-del':if(!sure(el))return;d.palettes=d.palettes.filter(p=>p.id!==id);save();render();break;
 case 'pal-match':{const p=find(d.palettes,id),dist=(a,b)=>{const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);return Math.hypot((A>>16)-(B>>16),(A>>8&255)-(B>>8&255),(A&255)-(B&255))};const hits=d.yarns.filter(y=>y.kind!=='kit').map(y=>({y,s:Math.min(...p.cols.map(c=>dist(c,y.hex)))})).filter(x=>x.s<90).sort((a,b)=>a.s-b.s).slice(0,8);go(()=>`<h2>${esc(p.name)}</h2><div class="palcard"><div class="cols">${p.cols.map(c=>`<i style="background:${c}"></i>`).join('')}</div></div><h3>Closest in your ${isYarn()?'stash':'supplies'}</h3>${hits.length?`<div class="swatches">${hits.map(({y})=>sw(y)).join('')}</div>`:'<p class="small">Nothing close yet.</p>'}`);break}
 case 'sview':ui.sview=v;render();break;
 case 'sort':ui.sort=el.value;render();break;
 case 'buster':ui.bust=null;go(sBuster());break;
 case 'bust-again':ui.bust=null;drawSheet();break;
 case 'giftcal':ui.vals={};go(sGifts());break;
 case 'occ-save':{capture();const name=val('occName').trim(),date=val('occDate');if(!name)return err('Who is it for?','occName');if(!date)return err('Pick a date','occDate');S.occasions.push({id:uid(),name,occ:val('occWhat').trim()||'Occasion',date,yearly:true,craft:S.craft,pid:val('occP')||null});ui.vals={};save();drawSheet(false,true);toast('Added to your gift calendar');break}
 case 'occ-del':if(!sure(el))return;S.occasions=S.occasions.filter(o=>o.id!==v);save();drawSheet();break;
 case 'occ-open':if(el.dataset.c!==S.craft){S.craft=el.dataset.c;save()}ui.vals={};go(sProject(id));break;
 case 'skills':go(sSkills());break;
 case 'skill':{const g=S.skills[S.craft]=S.skills[S.craft]||{};if(g[v])delete g[v];else{g[v]=dayKey();confetti();toast('Badge earned: '+v)}save();drawSheet();break}
 case 'skill-add':{const inp=$('#newskill'),t=inp.value.trim();if(!t){inp.focus();return}const x=S.skillsExtra[S.craft]=S.skillsExtra[S.craft]||[];if(!skillList(S.craft).includes(t))x.push(t);save();drawSheet(false,true);break}
 case 'board':go(sBoard(id));break;
 case 'playlist':{const u=el.value.trim(),p=find(d.projects,id);p.playlist=/^https?:\/\//i.test(u)?u:'';if(u&&!p.playlist)toast('Paste a full link starting with https://');save();drawSheet();break}
 case 'pg':ui.page+=+v;ui.flip=true;drawSheet(false,true);ui.flip=false;break;
 case 'post':openPost();break;
 case 'post-save':{const c=ui.postCanvas;if(!c)return;c.toBlob(b=>{if(b)saveFile(`my-${yearData().yr}-${S.craft}.png`,b)},'image/png');break}
 case 'trophy-close':el.closest('.trophy').remove();break;
 case 'fx':S.fx[v]=el.checked;if(v==='sounds'&&!el.checked){stopSound();ui.soundOpen=false}save();render();break;
 case 'season':S.season=el.value;save();render();break;
 case 'icon':S.icon=v;save();render();break;
 case 'me-name':S.me.name=el.value.trim();save();render();break;
 case 'me-bday':S.me.bday=el.value;save();render();break;
 case 'sound-open':ui.soundOpen=!ui.soundOpen;header();break;
 case 'sound':playSound(v);header();break;
 case 'vol':S.vol=+el.value;if(snd)snd.master.gain.value=S.vol*.7;save();break;
 case 'egg':{ui.egg++;clearTimeout(ui.eggT);ui.eggT=setTimeout(()=>ui.egg=0,1800);if(ui.egg>=5){ui.egg=0;if(S.fx.easter)storm()}break}
 case 'chide':if(visCrafts().length<=1){toast('Keep at least one craft');return}S.hidden.push(v);if(S.craft===v)S.craft=visCrafts()[0].id;save();render();toast(nameOf(v)+' hidden. You can bring it back below.');break;
 case 'cshow':S.hidden=S.hidden.filter(x=>x!==v);save();render();break;
 case 'ob-again':S.onboarded=false;ui.ob=0;ui.obC=visCrafts().map(c=>c.id);render();window.scrollTo(0,0);break;
 case 'ob-skip':S.onboarded=true;save();render();break;
 case 'ob-back':ui.ob--;render();break;
 case 'ob-craft':ui.obC=toggle(ui.obC,v);render();break;
 case 'ob-next':{if(ui.ob===0){const n=$('#obName');if(n)S.me.name=n.value.trim()}if(ui.ob===2&&!ui.obC.length)return err('Pick at least one craft');if(ui.ob<3){ui.ob++;save();render();window.scrollTo(0,0);break}const ch=ui.obC.slice();S.hidden=allCrafts().map(c=>c.id).filter(x=>!ch.includes(x));S.order=[...allCrafts().map(c=>c.id).filter(x=>ch.includes(x)),...allCrafts().map(c=>c.id).filter(x=>!ch.includes(x))];S.craft=ch[0];S.tab='ideas';S.onboarded=true;save();render();window.scrollTo(0,0);toast('All set! Happy making.');break}
 case 'tip-ok':S.tips.done[v]=1;save();render();if(sheetFn)drawSheet(false,true);break;
 case 'tip-later':ui.later=ui.later||{};ui.later[v]=1;render();if(sheetFn)drawSheet(false,true);break;
 case 'tip-skip':S.tips.off=true;save();render();if(sheetFn)drawSheet(false,true);toast('Tips are off. Turn them back on in Settings → Fun extras.');break;
 case 'tips-reset':S.tips={done:{},off:false};ui.later={};save();render();toast('Tips are back on');break;
 case 'cat-add':ui.catAdd=!ui.catAdd;render();if(ui.catAdd)setTimeout(()=>$('#newcat')?.focus(),30);break;
 case 'cat-edit':ui.catEdit=!ui.catEdit;render();break;
 case 'add-combo':{const c={id:uid(),name:'My colour combo',cols:[]};d.combos.unshift(c);if(el.dataset.t){const x=find(d[el.dataset.t],el.dataset.x);if(x)x.combos=[...(x.combos||[]),c.id]}save();ui.vals={};ui.photoCols=null;go(sCombo(c.id));setTimeout(()=>{const n=$('#cName');if(n){n.focus();n.select()}},60);break}
 case 'combo':ui.vals={};ui.photoCols=null;go(sCombo(id));break;
 case 'cname':{const c=find(d.combos,id);const t=el.value.trim();if(t){c.name=t;save()}else el.value=c.name;break}
 case 'ccname':{find(d.combos,id).cols[+el.dataset.k].name=el.value.trim();save();break}
 case 'ccdel':find(d.combos,id).cols.splice(+el.dataset.k,1);save();drawSheet();break;
 case 'ccadd':{capture();let h=val('cHex').trim();if(h&&!h.startsWith('#'))h='#'+h;if(h&&!/^#[0-9a-f]{6}$/i.test(h))return err('That code should look like #a50305');const hex=(h||val('cPick','#b88896')).toLowerCase();find(d.combos,id).cols.push({hex});ui.vals.cHex='';save();drawSheet(false,true);break}
 case 'ccyarn':{const y=find(d.yarns,el.dataset.y);find(d.combos,id).cols.push({hex:y.hex,name:y.name,y:y.id});save();drawSheet();toast('Added '+y.name);break}
 case 'ccphoto':find(d.combos,id).cols.push({hex:v});save();drawSheet();break;
 case 'ccphotoall':{const c=find(d.combos,id);ui.photoCols.cols.forEach(h=>c.cols.push({hex:h}));ui.photoCols=null;save();drawSheet();break}
 case 'clink':go(sComboLink(id,v));break;
 case 'pick-combos':go(sPickCombos(el.dataset.t,id));break;
 case 'ctoggle':{const x=find(d[el.dataset.t],el.dataset.x);x.combos=toggle(x.combos||[],id);save();drawSheet();break}
 case 'del-combo':if(!sure(el))return;d.combos=d.combos.filter(c=>c.id!==id);['ideas','projects','yarns'].forEach(k=>d[k].forEach(x=>{if(x.combos)x.combos=x.combos.filter(c=>c!==id)}));save();closeSheet();toast('Colour combo deleted');break;
 case 'flink':{const u=el.value.trim();if(/^https?:\/\//i.test(u)&&!ui.form.img){capture();if(srcOf(u)!=='Website')ui.vals.fSrc=srcOf(u);previewForForm(u)}break}
 case 'refetch':{const i=find(d.ideas,id);if(i&&i.link)autoPicture(d,id,i.link,false);break}
 case 'lpkey':{const k=$('#lpKey').value.trim();S.lpKey=k;save();render();toast(k?'Key saved':'Key removed');break}
 case 'backup':saveFile(`my-crafts-backup-${dayKey()}.json`,new Blob([JSON.stringify(S)],{type:'application/json'}));break;
 case 'gd-sync':if(!LS.get('user')){ui.gate=true;render();break}if(GD.needAuth||!GD.ready)GD.connect(true);else GD.push();break;
 case 'gd-copies':{const box=$('#copies');if(!box)break;box.innerHTML='<p class="small">Looking...</p>';GD.copies().then(l=>{box.innerHTML=l.length?l.map(f=>`<div class="lrow" style="cursor:default"><span><b>${esc(new Date(f.modifiedTime).toLocaleString('en-AU',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}))}</b><span class="small">${/unsynced/.test(f.name)?'Changes kept from a device that was out of date':'Daily copy'}</span></span><button class="btn small" data-act="gd-restore" data-id="${esc(f.id)}">Restore this</button></div>`).join(''):'<p class="small">No copies yet. The first one is made today.</p>'}).catch(()=>{box.innerHTML='<p class="small">Tap "Tap to sync" at the top first, then try again.</p>'});break}
 case 'gd-restore':if(!sure(el))return;GD.restore(id).catch(()=>toast("That copy couldn't be opened"));break;
 case 'gd-signout':if(!sure(el))return;GD.signOut();break;
 case 'save-media':saveMedia(el.dataset.m,el.dataset.n);break;
 case 'gate-signin':ui.gateMsg='';el.textContent='Signing in…';GD.connect(true);break;
 case 'gate-local':LS.set('local','1');ui.gate=false;render();break;
 case 'addcat':{const c=dataFor(el.dataset.c),inp=$('#newcat'),t=inp.value.trim();if(!t||c.cats.includes(t)){inp.focus();return}c.cats.push(t);ui.catAdd=false;ui.cat=t;save();render();toast('Added '+t);break}
 case 'delcat':{if(!sure(el))return;const c=dataFor(el.dataset.c);c.cats=c.cats.filter(x=>x!==v);c.ideas.forEach(i=>{if(i.cat===v)i.cat=''});if(ui.cat===v)ui.cat='All';save();render();break}
 }}

let drag=null;
document.addEventListener('pointerdown',e=>{const h=e.target.closest('.handle');if(!h)return;e.preventDefault();drag=h.closest('.crow');drag.classList.add('dragging');try{h.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!drag)return;const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.crow');if(!t||t===drag||t.parentNode!==drag.parentNode)return;const kids=[...drag.parentNode.children];if(kids.indexOf(drag)<kids.indexOf(t))t.after(drag);else t.before(drag)});
document.addEventListener('pointerup',()=>{if(!drag)return;const list=drag.parentNode;drag.classList.remove('dragging');S.order=[...list.children].map(r=>r.dataset.v);drag=null;save();render()});
document.addEventListener('click',e=>{if(e.target.id==='ov'){closeSheet();return}const el=e.target.closest('[data-act]');if(!el||/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName))return;act(el.dataset.act,el)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.up){onUpload(el);el.value='';return}if(el.dataset.act&&el.dataset.act!=='pnotes')act(el.dataset.act,el)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.act==='pnotes'){find(D().projects,el.dataset.id).notes=el.value;save()}else if(el.id&&$('#formErr'))$('#formErr').textContent=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetFn)closeSheet();if(e.key!=='Enter')return;const map={newstep:'addstep',newcat:'addcat',nextIn:'setnext',kitem:'kadd',newcraft:'addcraft'};const a=map[e.target.id];if(a){e.preventDefault();$(`[data-act=${a}]`)?.click()}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();render()})}catch(_){}
(async()=>{let st=null;try{st=await IDB.get('kv','state')}catch(e){}
 if(!st){try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}}
 if(st&&st.crafts)S=migrate(st);
 if(LS.get('user')&&st&&st.crafts){render();GD.connect(false)}
 else if(LS.get('local')&&!LS.get('user'))render();
 else{ui.gate=true;render()}
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
})();
}
</script>
